[build-system]
requires = [
    "setuptools>=77.0.1 ; python_version>='3'",
]
build-backend = "setuptools.build_meta"

[project]
name = "sgp4"
description = "The C++ SGP4 routine that, given an Earth satellite TLE, computes its position."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version", "authors", "dependencies", "classifiers"]

[dependency-groups]
dev = [
    "numpy>=1.21.2",
]

[tool.cibuildwheel]
build-verbosity = 0
skip = [
    "cp314t-*",
]
test-groups = ["dev"]
test-command = [
    "python -m unittest sgp4.tests",
]

[tool.uv]
cache-keys = [
    { env = "PYTHON_SGP4_COMPILE" }
]
